  Scans physical TV series, checks ThemerrDB by TMDB ID, strictly matched
  AnimeThemes openings, then Plex by TVDB ID. New downloads are normalized,
  validated, written atomically, and followed by a Jellyfin item refresh.
  Existing theme.mp3 files are never overwritten.
