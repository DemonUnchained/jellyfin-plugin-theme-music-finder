framework: "net10.0"
overview: "Finds missing TV series theme music and saves it as theme.mp3."
description: >
  Scans physical TV series, checks exact stable-ID source overrides, ThemerrDB by
  TMDB ID, library-aware strictly matched AnimeThemes openings or a safe ending
  fallback, then Plex by TVDB ID, followed by conservative multi-source searches
  from YouTube, SoundCloud, and anime Bilibili. New downloads are normalized, validated,
  written atomically, and followed by a Jellyfin item refresh. Existing
  theme.mp3 files are never overwritten. Autonomous source writes are opt-in,
  and a read-only whole-library discovery audit is provided.
category: "Metadata"
