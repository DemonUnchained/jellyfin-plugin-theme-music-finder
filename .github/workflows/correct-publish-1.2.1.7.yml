name: Correct and publish v1.2.1.7

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Correct cross-platform test and remove temporary workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          test_path = Path("tests/Jellyfin.Plugin.ThemeMusicFinder.Tests/CuratedThemeSourceStoreTests.cs")
          source = test_path.read_text(encoding="utf-8")
          old = """    [InlineData("https://www.youtube.com/watch?v=abc%201234567")]
              [InlineData("https://www.youtube.com/watch?%76=abc12345678")]
              public void EscapedOrMalformedVideoParametersAreRejected(string input)
          """
          new = """    [InlineData("https://www.youtube.com/watch?v=abc%201234567")]
              public void EscapedOrMalformedVideoIdsAreRejected(string input)
          """
          if old not in source:
              raise SystemExit("Expected test block not found")
          test_path.write_text(source.replace(old, new), encoding="utf-8")
          Path(".github/workflows/correct-publish-1.2.1.7.yml").unlink()
          PY
      - name: Restore
        run: dotnet restore Jellyfin.Plugin.ThemeMusicFinder.slnx
      - name: Build
        run: dotnet build Jellyfin.Plugin.ThemeMusicFinder.slnx -c Release --no-restore
      - name: Test
        run: dotnet test tests/Jellyfin.Plugin.ThemeMusicFinder.Tests/Jellyfin.Plugin.ThemeMusicFinder.Tests.csproj -c Release
      - name: Commit correction and update release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix cross-platform curated URL test"
          git tag -fa v1.2.1.7 -m "Theme Music Finder 1.2.1.7"
          git push origin HEAD:main
          git push origin +refs/tags/v1.2.1.7
