name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Jellyfin.Plugin.ThemeMusicFinder.slnx
      - run: dotnet build Jellyfin.Plugin.ThemeMusicFinder.slnx -c Release --no-restore
      - run: dotnet test tests/Jellyfin.Plugin.ThemeMusicFinder.Tests/Jellyfin.Plugin.ThemeMusicFinder.Tests.csproj -c Release
      - run: bash ./build.sh
      - uses: actions/upload-artifact@v5
        with:
          name: ThemeMusicFinder
          path: dist/ThemeMusicFinder_*.zip
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          asset="$(find dist -maxdepth 1 -type f -name 'ThemeMusicFinder_*.zip' -print -quit)"
          version="$(basename "$asset" .zip)"
          version="${version#ThemeMusicFinder_}"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset="$(find dist -maxdepth 1 -type f -name 'ThemeMusicFinder_*.zip' -print -quit)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$asset" \
              --title "Theme Music Finder ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi


  jellyfin-12-3-load-smoke:
    name: Plugin load on Jellyfin 12.3
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: ThemeMusicFinder
          path: dist
      - name: Install release ZIP into isolated Jellyfin configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jellyfin-smoke/config/plugins/Theme Music Finder_1.2.2.0"
          mkdir -p "$RUNNER_TEMP/jellyfin-smoke/cache"
          unzip -q "dist/ThemeMusicFinder_1.2.2.0.zip" \
            -d "$RUNNER_TEMP/jellyfin-smoke/config/plugins/Theme Music Finder_1.2.2.0"
          test -f "$RUNNER_TEMP/jellyfin-smoke/config/plugins/Theme Music Finder_1.2.2.0/meta.json"
      - name: Start official Jellyfin 12.3 image
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name theme-plugin-smoke \
            -v "$RUNNER_TEMP/jellyfin-smoke/config:/config" \
            -v "$RUNNER_TEMP/jellyfin-smoke/cache:/cache" \
            jellyfin/jellyfin:12.3
      - name: Assert that Jellyfin loads the plugin
        shell: bash
        run: |
          set -euo pipefail
          loaded=0
          for i in $(seq 1 90); do
            if docker logs theme-plugin-smoke 2>&1 | grep -iEq \
              'Loaded plugin.*Theme Music Finder|Loaded plugin.*ThemeMusicFinder'; then
              loaded=1
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' theme-plugin-smoke | grep -q true; then
              echo "Jellyfin exited before plugin load" >&2
              docker logs theme-plugin-smoke 2>&1 | tail -n 120
              exit 1
            fi
            sleep 2
          done
          if [[ "$loaded" -ne 1 ]]; then
            echo "Plugin load was not confirmed by Jellyfin startup logs" >&2
            docker logs theme-plugin-smoke 2>&1 | tail -n 140
            exit 1
          fi
          if [[ ! -f "$RUNNER_TEMP/jellyfin-smoke/config/plugins/Theme Music Finder_1.2.2.0/Jellyfin.Plugin.ThemeMusicFinder.dll" ]]; then
            echo "Jellyfin removed or relocated the plugin during startup" >&2
            exit 1
          fi
          docker logs theme-plugin-smoke 2>&1 | grep -iE \
            'Loaded plugin.*Theme Music Finder|Loaded plugin.*ThemeMusicFinder' | tail -n 5
      - name: Restart Jellyfin and verify plugin persistence
        shell: bash
        run: |
          set -euo pipefail
          loaded_before="$(docker logs theme-plugin-smoke 2>&1 | grep -icE \
            'Loaded plugin.*Theme Music Finder|Loaded plugin.*ThemeMusicFinder' || true)"
          docker restart theme-plugin-smoke >/dev/null
          reloaded=0
          for i in $(seq 1 75); do
            loaded_after="$(docker logs theme-plugin-smoke 2>&1 | grep -icE \
              'Loaded plugin.*Theme Music Finder|Loaded plugin.*ThemeMusicFinder' || true)"
            if [[ "$loaded_after" -gt "$loaded_before" ]]; then
              reloaded=1
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' theme-plugin-smoke | grep -q true; then
              echo "Jellyfin exited on restart" >&2
              exit 1
            fi
            sleep 2
          done
          if [[ "$reloaded" -ne 1 ]]; then
            echo "Plugin did not reload after Jellyfin restarted" >&2
            exit 1
          fi
          test -f "$RUNNER_TEMP/jellyfin-smoke/config/plugins/Theme Music Finder_1.2.2.0/Jellyfin.Plugin.ThemeMusicFinder.dll"
          echo "Theme Music Finder survived restart and was loaded again"
      - name: Show diagnostics on failure
        if: failure()
        run: docker logs theme-plugin-smoke 2>&1 | tail -n 180 || true
      - name: Stop smoke-test container
        if: always()
        run: docker rm -f theme-plugin-smoke >/dev/null 2>&1 || true
