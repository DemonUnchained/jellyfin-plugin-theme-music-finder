name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Jellyfin.Plugin.ThemeMusicFinder.slnx
      - run: dotnet build Jellyfin.Plugin.ThemeMusicFinder.slnx -c Release --no-restore
      - run: dotnet test tests/Jellyfin.Plugin.ThemeMusicFinder.Tests/Jellyfin.Plugin.ThemeMusicFinder.Tests.csproj -c Release
      - run: bash ./build.sh
      - uses: actions/upload-artifact@v5
        with:
          name: ThemeMusicFinder
          path: dist/ThemeMusicFinder_*.zip
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          asset="$(find dist -maxdepth 1 -type f -name 'ThemeMusicFinder_*.zip' -print -quit)"
          version="$(basename "$asset" .zip)"
          version="${version#ThemeMusicFinder_}"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset="$(find dist -maxdepth 1 -type f -name 'ThemeMusicFinder_*.zip' -print -quit)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$asset" \
              --title "Theme Music Finder ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
