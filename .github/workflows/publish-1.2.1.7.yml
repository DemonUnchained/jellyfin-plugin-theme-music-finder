name: Publish Theme Music Finder 1.2.1.7

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply verified release patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode | gzip --decompress > "$RUNNER_TEMP/theme-music-finder-1.2.1.7.patch"
          git apply --binary "$RUNNER_TEMP/theme-music-finder-1.2.1.7.patch"
          rm -f .github/workflows/publish-1.2.1.7.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Theme Music Finder 1.2.1.7"

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.ThemeMusicFinder.slnx

      - name: Build
        run: dotnet build Jellyfin.Plugin.ThemeMusicFinder.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/Jellyfin.Plugin.ThemeMusicFinder.Tests/Jellyfin.Plugin.ThemeMusicFinder.Tests.csproj -c Release --no-build

      - name: Package
        run: bash ./build.sh

      - name: Validate release package
        shell: bash
        run: |
          set -euo pipefail
          asset="dist/ThemeMusicFinder_1.2.1.7.zip"
          test -f "$asset"
          expected="$(printf '%s\n' 'Jellyfin.Plugin.ThemeMusicFinder.dll' 'LICENSE' 'THIRD_PARTY_NOTICES.md' 'YoutubeExplode.dll' 'meta.json' | sort)"
          actual="$(unzip -Z1 "$asset" | sort)"
          test "$actual" = "$expected"
          unzip -p "$asset" meta.json | grep -F '"version": "1.2.1.7"'
          unzip -p "$asset" meta.json | grep -F '"status": "Active"'

      - name: Push source and tag
        shell: bash
        run: |
          set -euo pipefail
          git tag -a v1.2.1.7 -m "Theme Music Finder 1.2.1.7"
          git push --atomic origin HEAD:main refs/tags/v1.2.1.7
